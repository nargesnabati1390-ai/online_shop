<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            font-family:Arial;
            background:#f3efff;
            padding:30px;
        }

        .box{
            width:400px;
            margin:20px auto;
            padding:20px;
            background:white;
            border-radius:12px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        h3{
            color:#6c4ab6;
            text-align:center;
        }

        input{
            width:100%;
            padding:10px;
            margin:7px 0;
            box-sizing:border-box;
            border:1px solid #ddd;
            border-radius:7px;
        }

        button{
            padding:10px 18px;
            border:0;
            border-radius:7px;
            background:#8b6dcc;
            color:white;
            cursor:pointer;
        }
    </style>
    <title>Online shop</title>
</head>
<body>
   <div class="box">
    <h3>add new product</h3>
    <input type="text" id="name" placeholder="name product">
    <input type="number" id="price" placeholder="price product">
    <input type="number" id="stock" placeholder="stock product">
    <button onclick="addproduct()">save</button>

   </div>  
   <div class="box">
    <h3>list products</h3>
    <button onclick="getproducts()" style="background-color:hotpink;">get products</button>
    <div id="products-list">

    </div>

   </div>
   <script src="scripts.js"></script>
</body>
</html>
